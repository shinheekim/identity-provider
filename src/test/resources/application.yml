spring:
  datasource:
    url: jdbc:h2:mem:login_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

app:
  jwt:
    issuer: taesin
    access-token-expiry-seconds: 1800
    secret: test-only-jwt-secret-key-change-me-1234567890-abcdef
